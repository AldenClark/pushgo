name: Apple Concurrency Gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  strict-concurrency:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4"

      - name: Run Apple concurrency gate
        run: |
          ./scripts/apple_concurrency_gate.sh
