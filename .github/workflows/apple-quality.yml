name: Apple Product Quality

on:
  pull_request:
    # Labeled events provide a PR-only entry while this workflow is absent from
    # the default branch. Reapply apple-ui-diagnostic for a separate trial-1 run
    # only after reviewing the first run; each run keeps its own run ID and SHA.
    # apple-ios-ui-diagnostic selects a separate three-journey Simulator run;
    # apple-macos-message-delete-diagnostic selects one deletion-route journey.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [ main ]
    tags: [ "v*" ]
  schedule:
    - cron: "17 18 * * *"
    - cron: "29 19 * * 6"
  workflow_dispatch:
    inputs:
      lane:
        description: Quality lane to run
        required: true
        default: nightly
        type: choice
        options:
          - pr
          - nightly
          - accessibility
          - performance
          - release-isolation
          - release
      diagnostic_mode:
        description: Separate native diagnostic; does not run or pass the product quality gate
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - macos-adhoc-thing
          - macos-adhoc-message-deletion
          - apple-release-sdk
          - apple-ios-ui
      diagnostic_sha:
        description: Exact 40-character SHA of the selected branch tip (required for diagnostic)
        required: false
        type: string
      diagnostic_trial:
        description: Run trial 2 only after trial 1 has clean native product and test-system evidence
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      diagnostic_first_run_id:
        description: Clean trial 1 GitHub run ID; required only for diagnostic trial 2
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apple-quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.run_id || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action != 'labeled') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  quality:
    if: ${{ (github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.action != 'labeled')) || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'off') }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      QUALITY_LANE: ${{ github.event_name == 'schedule' && github.event.schedule == '29 19 * * 6' && 'performance' || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.lane || startsWith(github.ref, 'refs/tags/') && 'release' || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan changed capability evidence
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/quality_impact.py \
            --audit-product-tree \
            --output build/quality-results/apple-impact-tree-audit.json \
            --check
          python3 scripts/quality_impact.py \
            --base "$QUALITY_BASE_SHA" \
            --head "$GITHUB_SHA" \
            --output build/quality-results/apple-impact-plan.json \
            --check
          echo "QUALITY_IMPACT_PLAN=build/quality-results/apple-impact-plan.json" >> "$GITHUB_ENV"
          impact_lane="$(python3 -c 'import json; print(json.load(open("build/quality-results/apple-impact-plan.json"))["recommended_lane"])')"
          if [[ "$impact_lane" == "not-run" ]]; then
            echo "QUALITY_SKIP_PRODUCT=1" >> "$GITHUB_ENV"
          else
            echo "QUALITY_LANE=$impact_lane" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        if: env.QUALITY_SKIP_PRODUCT != '1'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4"

      - name: Run value-based Apple quality lane
        if: env.QUALITY_SKIP_PRODUCT != '1'
        run: ./scripts/quality_test.sh "$QUALITY_LANE"

      - name: Record intentional no-product run
        if: env.QUALITY_SKIP_PRODUCT == '1'
        run: |
          python3 scripts/quality_result.py \
            --output build/quality-results/apple-changed-summary.json \
            --platform apple \
            --lane changed \
            --product-status NOT_RUN \
            --test-system-status PASSED \
            --not-run "No mapped Apple product capability changed; product lane intentionally not run." \
            --reason "documentation or unrelated support-only change"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-quality-${{ env.QUALITY_LANE }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/quality-results/ios/**/*.xcresult
            build/quality-results/ios/**/*.log
            build/quality-results/ios-physical-performance/**/*.xcresult
            build/quality-results/ios-physical-performance/**/*.log
            build/quality-results/watchos/**/*.xcresult
            build/quality-results/watchos/**/*.log
            build/quality-results/*.log
            build/quality-results/*.json
            !build/quality-results/*-summary.json

      - name: Upload compact longitudinal receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-quality-receipts-${{ env.QUALITY_LANE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: build/quality-results/*-summary.json

  macos_adhoc_ui_diagnostic:
    name: Ad-hoc macOS App-owned UI diagnostic (not a quality gate)
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.diagnostic_mode == 'macos-adhoc-thing' || inputs.diagnostic_mode == 'macos-adhoc-message-deletion')) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'apple-ui-diagnostic' || github.event.label.name == 'apple-macos-message-delete-diagnostic')) }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DIAGNOSTIC_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.diagnostic_sha }}
      DIAGNOSTIC_TRIAL: ${{ github.event_name == 'pull_request' && '1' || inputs.diagnostic_trial }}
      DIAGNOSTIC_FIRST_RUN_ID: ${{ inputs.diagnostic_first_run_id }}
      DIAGNOSTIC_MACOS_SCOPE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'macos-adhoc-message-deletion') || (github.event_name == 'pull_request' && github.event.label.name == 'apple-macos-message-delete-diagnostic')) && 'message-deletion-route' || 'thing-relations' }}
    steps:
      - name: Verify selected ref and requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          EVENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FIRST_RUN_ID: ${{ env.DIAGNOSTIC_FIRST_RUN_ID }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'diagnostic_sha must be a lowercase full commit SHA'; exit 2; }
          [[ "$REQUESTED_SHA" == "$EVENT_SHA" ]] || { echo 'diagnostic SHA must match the event source head'; exit 2; }
          if [[ "$DIAGNOSTIC_TRIAL" == '2' ]]; then
            [[ "$FIRST_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'trial 2 requires a reviewed clean trial 1 run ID'; exit 2; }
          fi

      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out byte
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || { echo 'checked-out SHA differs from requested SHA'; exit 2; }

      - name: Select quality Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4'

      - name: Run one native ad-hoc App-owned diagnostic
        run: bash scripts/ci/run_macos_adhoc_ui_diagnostic.sh

      - name: Retain diagnostic build, signing, console, native log, and xcresult
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-macos-adhoc-ui-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: build/quality-results/apple-macos-adhoc-ui-diagnostic/

  apple_release_sdk_diagnostic:
    name: Apple iOS/watchOS Release SDK diagnostic (not a quality gate)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'apple-release-sdk') || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'apple-release-sdk-diagnostic') }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DIAGNOSTIC_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.diagnostic_sha }}
    steps:
      - name: Verify selected ref and requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          EVENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'diagnostic_sha must be a lowercase full commit SHA'; exit 2; }
          [[ "$REQUESTED_SHA" == "$EVENT_SHA" ]] || { echo 'diagnostic SHA must match the event source head'; exit 2; }

      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out byte
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || { echo 'checked-out SHA differs from requested SHA'; exit 2; }

      - name: Select quality Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4'

      - name: Build and verify Simulator Release SDK products
        env:
          EXPECTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
        run: bash scripts/ci/run_apple_release_sdk_diagnostic.sh

      - name: Retain compact Release SDK diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-release-sdk-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: build/quality-results/apple-release-sdk-diagnostic/

  ios_ui_diagnostic:
    name: iOS App-owned message UI diagnostic (not a quality gate)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'apple-ios-ui') || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'apple-ios-ui-diagnostic') }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DIAGNOSTIC_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.diagnostic_sha }}
    steps:
      - name: Verify selected ref and requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          EVENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'diagnostic_sha must be a lowercase full commit SHA'; exit 2; }
          [[ "$REQUESTED_SHA" == "$EVENT_SHA" ]] || { echo 'diagnostic SHA must match the event source head'; exit 2; }

      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out byte
        shell: bash
        env:
          REQUESTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || { echo 'checked-out SHA differs from requested SHA'; exit 2; }

      - name: Select quality Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4'

      - name: Build, install, and run three App-owned iOS journeys
        env:
          EXPECTED_SHA: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          MAX_RETRIES: '0'
        run: bash scripts/ci/run_ios_ui_diagnostic.sh

      - name: Retain native iOS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-ios-ui-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: build/quality-results/apple-ios-ui-diagnostic/

  observation:
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '17 18 * * *' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build retained observation report
        env:
          QUALITY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/quality_observation_collect.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow apple-quality.yml \
            --artifact-name-prefix apple-quality-receipts- \
            --output build/quality-observation-input
          python3 scripts/quality_observation.py \
            --input build/quality-observation-input \
            --output build/quality-results/apple-two-week-observation.json \
            --required-lane pr \
            --required-lane nightly \
            --required-lane release

      - name: Upload longitudinal observation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-quality-observation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: build/quality-results/apple-two-week-observation.json
