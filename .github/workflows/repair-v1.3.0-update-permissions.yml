name: Repair v1.3.0 update permissions

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install deploy key
        shell: bash
        env:
          PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64: ${{ secrets.PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64 }}
          PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS: ${{ secrets.PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/update-deploy-key"
          chmod 600 "$HOME/.ssh/update-deploy-key"
          printf '%s\n' "$PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Repair and verify public v1.3.0 files
        shell: bash
        env:
          PUSHGO_UPDATE_DEPLOY_HOST: ${{ secrets.PUSHGO_UPDATE_DEPLOY_HOST }}
          PUSHGO_UPDATE_DEPLOY_USER: ${{ secrets.PUSHGO_UPDATE_DEPLOY_USER }}
          PUSHGO_UPDATE_DEPLOY_PATH: ${{ secrets.PUSHGO_UPDATE_DEPLOY_PATH }}
          EXPECTED_SHA256: 6e48c39bcc9744229d44edecc617bede5857c7368c812cbf6c1993cf37a263e2
        run: |
          set -euo pipefail
          release_dir="${PUSHGO_UPDATE_DEPLOY_PATH%/}/stable/v1.3.0"
          ssh -i "$HOME/.ssh/update-deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            "${PUSHGO_UPDATE_DEPLOY_USER}@${PUSHGO_UPDATE_DEPLOY_HOST}" \
            "chmod 755 '${PUSHGO_UPDATE_DEPLOY_PATH%/}' '${PUSHGO_UPDATE_DEPLOY_PATH%/}/stable' '$release_dir' && find '$release_dir' -type d -exec chmod 755 {} + && find '$release_dir' -type f -exec chmod 644 {} + && chmod 644 '${PUSHGO_UPDATE_DEPLOY_PATH%/}/appcast.xml'"
          curl -fsSL "https://update.pushgo.cn/macos/stable/v1.3.0/PushGo-macOS-v1.3.0.dmg?run=${GITHUB_RUN_ID}" -o /tmp/PushGo-macOS-v1.3.0.dmg
          printf '%s  %s\n' "$EXPECTED_SHA256" /tmp/PushGo-macOS-v1.3.0.dmg | sha256sum --check --strict
